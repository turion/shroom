on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '23 14 * * 2'
name: build
jobs:
  lint:
    name: "Run hlint"
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up HLint
      uses: haskell-actions/hlint-setup@v2
      with:
        version: "3.6.1"
    - name: Run HLint
      uses: haskell-actions/hlint-run@v2
      with:
        fail-on: warning

  fourmolu:
    name: "Run fourmolu"
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: haskell-actions/run-fourmolu@v13
      with:
        version: "0.19.0.1"

  generateMatrix:
    name: "Generate matrix from cabal"
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    runs-on: ubuntu-latest
    steps:
      - uses: kleidukos/get-tested@v0.1.9.1
        id: set-matrix
        with:
          cabal-file: "shroom/shroom.cabal"
          ubuntu: true
          version: 0.1.6.0

  build-cabal:
    runs-on: ubuntu-latest
    needs: generateMatrix
    strategy:
      matrix: ${{ fromJSON(needs.generateMatrix.outputs.matrix) }}
    name: Haskell GHC ${{ matrix.ghc }} cabal
    steps:
      - uses: actions/checkout@v7
      - uses: haskell-actions/setup@v2
        id: setup
        with:
          ghc-version: ${{ matrix.ghc }}
      - name: Configure the build
        run: |
          cabal configure --enable-tests --enable-benchmarks --disable-documentation -f-anthropic -f-anthropic-proxy -f-ollama
          cabal build all --dry-run
        # The last step generates dist-newstyle/cache/plan.json for the cache key.
      - name: Restore cached dependencies
        uses: actions/cache/restore@v6
        id: cache
        env:
          key: ${{ runner.os }}-ghc-${{ steps.setup.outputs.ghc-version }}-cabal-${{ steps.setup.outputs.cabal-version }}
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: ${{ env.key }}-plan-${{ hashFiles('**/plan.json') }}
          restore-keys: ${{ env.key }}-
      - name: Install dependencies
        # If we had an exact cache hit, the dependencies will be up to date.
        if: steps.cache.outputs.cache-hit != 'true'
        run: cabal build all --enable-tests --enable-benchmarks --only-dependencies -f-anthropic -f-anthropic-proxy -f-ollama
      # Cache dependencies already here, so that we do not have to rebuild them should the subsequent steps fail.
      - name: Save cached dependencies
        uses: actions/cache/save@v6
        # If we had an exact cache hit, trying to save the cache would error because of key clash.
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Cabal build packages
        run: cabal build all --enable-tests --enable-benchmarks -f-anthropic -f-anthropic-proxy -f-ollama
      - name: Cabal test
        run: cabal test all --enable-tests --test-show-details=Always -f-anthropic -f-anthropic-proxy -f-ollama

  generate-flake-ghc-matrix:
    name: Generate GHC versions for nix flake build matrix
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.generate-versions.outputs.versions }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Generate versions
        id: generate-versions
        run: |
          echo -n "versions=" >> "$GITHUB_OUTPUT"
          nix eval .#supportedGhcs --json --accept-flake-config >> "$GITHUB_OUTPUT"

  check-flake:
    name: Check Flake
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - run: nix flake check --accept-flake-config
      - name: Check whether .nix files are formatted
        run: |
          nix fmt --accept-flake-config
          git diff --exit-code

  check-cabal-file:
    name: Check cabal file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: haskell-actions/setup@v2
      - uses: tfausak/cabal-gild-setup-action@v2
        with:
          version: 1.5.0.3
      - run: ./cabal_check.sh

  build-flake:
    name: Nix Flake
    needs:
      - generate-flake-ghc-matrix
    strategy:
      matrix:
        version: ${{ fromJSON(needs.generate-flake-ghc-matrix.outputs.versions) }}
      fail-fast: false # So the cache is still filled
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: shroom
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - run: nix build .#${{ matrix.version }}.shroom-all --accept-flake-config
      - run: nix develop .#${{ matrix.version }} --accept-flake-config -c cabal update
      - run: nix develop .#${{ matrix.version }} --accept-flake-config -c cabal test all -f-anthropic -f-anthropic-proxy -f-ollama

  ollama-ci:
    # Runs two suites, one after the other, against the maintainer's one server:
    # shroom-test-integration-ollama (straight to Ollama) and
    # shroom-test-integration-anthropic-proxy (through the server's own Bifrost unit,
    # services.ollama.shroom.anthropicProxy). Both sit in this one job, so they serialise by
    # construction and never drive the 2-core box at once: no `concurrency:` group is needed.
    name: "Ollama integration, via SSH tunnel to the maintainer's server"
    runs-on: ubuntu-latest
    # Fork PRs get no secrets under plain `pull_request` (this workflow never uses
    # `pull_request_target`), so a fork PR would already fail to reach the tunnel; this gate
    # just makes that skip clean instead of failing red for a reason that has nothing to do
    # with shroom. push/schedule/workflow_dispatch have no `pull_request` context, so they
    # fall through to `true` and are unaffected.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # haskell-actions/setup gave a bare GHC/cabal that resolved straight from Hackage,
    # bypassing the flake's closure entirely; `nix develop` instead has to build that whole
    # closure from source, which is far slower, and the integration suite itself is slow
    # against a small model over a tunnel. The `shroom` cache is now wired via flake.nix's
    # `nixConfig` plus the cachix-action step below, but the first run after that wiring still
    # has to populate the cache from cold — 45 was sized for that cold build. Recalibrate it on
    # the second, warm run instead, once the cache is actually populated.
    #
    # Deliberately no `needs: build-flake`: if that job went red, this one would be skipped
    # and never observed. The tunnel opens right before the test step, so a slow cold build
    # only makes this job slow and cannot kill the tunnel. What can still blow the 60 minutes
    # is a cold build (a flake.lock bump, or possibly cache eviction) and the suites' own
    # runtime on the 2-core server, which is unobserved even on a warm cache. 60 is the old 45
    # (cold build plus the Ollama suite) plus 15 for the proxy suite: a similar handful of cases
    # (the conferenceChain ones excluded) on the same 1b model, through one extra local hop; the
    # build of that second test suite is small, as it shares the Ollama suite's closure. Each
    # case is separately capped at 10m below, so a hung case cannot eat this by itself.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: shroom
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - name: Update the cabal package index
        # `nix develop` should already provide every dependency, so this ought to be
        # unnecessary — but empirically it is sometimes required, and the trigger has not been
        # pinned down. Two candidates: cabal refusing to solve at all without a package index on
        # a fresh runner, and a test-only dependency escaping `shellFor`. Until one is confirmed,
        # keep this line; it is cheap on a warm cache and the failure it prevents is obscure.
        run: nix develop .#ghc912 --accept-flake-config -c cabal update -f-anthropic
      - name: Open the SSH tunnel to the maintainer's Ollama and Anthropic proxy
        # See research/remote-ollama-ci.md in the plan directory for the mechanism and the
        # threat model. The server-side ACL (permitopen + command="") is enforced by sshd via
        # nix/ollama-shroom.nix; this step only has to reach it. ssh-keyscan pins the host key
        # instead of StrictHostKeyChecking=no, so a redirected DNS name fails loudly rather
        # than tunnelling to somewhere else.
        run: |
          install -d -m 700 ~/.ssh
          # A herestring writes whatever it's handed — CRLF, a missing trailing newline, even
          # an empty secret — and exits 0, so a mangled key only surfaces two lines later as an
          # opaque libcrypto error out of ssh. printf+tr normalises the common web-UI paste
          # corruption, and ssh-keygen -y validates the result right where it was written.
          printf '%s\n' "${{ secrets.OLLAMA_SSH_KEY }}" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null
          ssh-keyscan -H "${{ vars.OLLAMA_SERVER_HOST }}" >> ~/.ssh/known_hosts
          # Keepalives prevent tunnel drop on idle; ExitOnForwardFailure fails the step if the forward setup fails.
          # Two forwards: Ollama (11434) and the server's Anthropic proxy (8787, the
          # anthropicProxy.port default). `ssh -L` succeeds even where the server's permitopen
          # denies the target — the denial shows only on the first connection — so each
          # port is checked with a real request in the steps below.
          ssh -o BatchMode=yes -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -o ExitOnForwardFailure=yes -f -N -L 11434:127.0.0.1:11434 -L 8787:127.0.0.1:8787 "ci-ollama@${{ vars.OLLAMA_SERVER_HOST }}"
      - name: Check the Ollama forward actually came up
        # Only the Ollama forward is checked here, on purpose: the Ollama suite below must not
        # depend on the proxy, which the maintainer has to enable on the server first. The
        # proxy's forward is checked in its own, later step.
        #
        # The /api/ps line is a meter, not a gate: it records in every run's log whether a
        # model was resident when the suite started. Empty `models` = nothing resident, so
        # this run pays the full cold load; an `expires_at` a few minutes out = keepAlive is
        # on Ollama's default; no expiry or one far out = "-1" is in effect. `|| true` keeps
        # it from ever failing the step — only the /api/tags check is a precondition.
        run: |
          curl --fail -sS http://127.0.0.1:11434/api/tags
          echo
          echo "Resident models (GET /api/ps, diagnostic only):"
          curl -sS http://127.0.0.1:11434/api/ps || true
          echo
      - name: Cabal test against the tunnelled Ollama
        id: ollama-suite
        # Bare host:port, no scheme and no /v1 — Ollama's own convention. -f-anthropic is the
        # job's only flag subtraction, at every cabal invocation in it: the ollama and
        # anthropic-proxy flags stay at their defaults (on), and the real-Anthropic suite is
        # the one this job has no key for. OLLAMA_MODEL must match services.ollama.shroom.model on the server
        # (nix/ollama-shroom.nix, default "llama3.2:1b" — the server is 2 cores / 12 GB,
        # no GPU, and an 8B model there runs at roughly 1-2 tokens/second). The suite's own
        # fallback (shroom-baikai/test/Integration/Ollama.hs, used only if OLLAMA_MODEL were
        # unset here) already agrees with that module default — llama3.2:1b both places — and
        # the two must be kept in step by hand; a mismatch fails with not_found_error rather
        # than testing anything about shroom.
        # Each case reports as it finishes; one slow case fails on 10m cap instead of eating the job's 60 minutes.
        # The conferenceChain cases test model capability, which a 1b model on 2 CPU cores cannot
        # do inside that cap; CI asserts plumbing, so they are skipped here and run locally. The
        # tasty pattern is its own --test-option pair: cabal word-splits --test-options.
        run: nix develop .#ghc912 --accept-flake-config -c cabal test shroom-test-integration-ollama --enable-tests -f-anthropic --test-show-details=streaming --test-options=--timeout=10m --test-option=-p --test-option='!/conferenceChain/'
        env:
          OLLAMA_HOST: 127.0.0.1:11434
          OLLAMA_MODEL: llama3.2:1b
      - name: Check the Anthropic proxy forward actually came up
        id: proxy-check
        # A real request through the 8787 forward, not merely the forward's existence: `ssh -L`
        # succeeds even when the server's permitopen denies the target, and the denial shows only
        # on the first connection. Bifrost answers 200 on /health once it is ready. Red here,
        # with the Ollama step above still green, means the server has not yet been rebuilt with
        # services.ollama.shroom.anthropicProxy.enable (and the permitopen entry that comes with
        # it) — the maintainer's step, not a shroom bug.
        #
        # This and the next step run after the Ollama suite and only if the tunnel and the
        # Ollama suite's step were reached at all (an earlier setup step failing skips them);
        # they do not depend on the Ollama suite passing, so each suite is observed on its own.
        # Sequential, never concurrent: the server is driven by one suite at a time.
        if: ${{ !cancelled() && steps.ollama-suite.conclusion != 'skipped' }}
        run: curl --fail -sS --max-time 30 http://127.0.0.1:8787/health
      - name: Cabal test against the tunnelled Anthropic proxy
        # The server's own anthropicProxy unit (Bifrost in front of its Ollama), not something
        # started on the runner. Same flag set as every other cabal invocation in this job, so
        # the build plan is shared. ANTHROPIC_PROXY_MODEL is `ollama/` plus the OLLAMA_MODEL tag
        # above (Bifrost's provider prefix); the URL has no /v1 but ends in Bifrost's
        # /anthropic route; the key is a placeholder (Bifrost checks none, baikai wants some
        # text). Same per-case cap and the same conferenceChain exclusion as the Ollama step
        # above, for the same reasons.
        if: ${{ !cancelled() && steps.proxy-check.conclusion == 'success' }}
        run: nix develop .#ghc912 --accept-flake-config -c cabal test shroom-test-integration-anthropic-proxy --enable-tests -f-anthropic --test-show-details=streaming --test-options=--timeout=10m --test-option=-p --test-option='!/conferenceChain/'
        env:
          ANTHROPIC_PROXY_URL: http://127.0.0.1:8787/anthropic
          ANTHROPIC_PROXY_MODEL: ollama/llama3.2:1b
          ANTHROPIC_PROXY_KEY: unused

  success:
    name: Successfully build and test on all systems
    needs:
      - build-cabal
      - build-flake
    runs-on:
      - ubuntu-latest
    steps:
      - run: echo "Success"
